services:
  database:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: example
      POSTGRES_PASSWORD: example
      POSTGRES_USER: example
    ports:
      - "${DATABASE_PORT:?DATABASE_PORT must be supplied by fed}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d example"]
      interval: 1s
      timeout: 3s
      retries: 20
    volumes:
      - database_data:/var/lib/postgresql/data

  cache:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 20
    ports:
      - "${CACHE_PORT:?CACHE_PORT must be supplied by fed}:6379"

volumes:
  database_data:
